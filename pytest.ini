[pytest]
testpaths = tests
# The repo root, so `core`, `api` and `main` import from anywhere. `python -m
# pytest` adds the working directory itself, but the bare `pytest` console
# script does not — without this the suite passes locally and fails in CI.
pythonpath = .
# --strict-config turns an unknown ini key into an error rather than a warning.
# A dead `timeout = 120` sat here unnoticed for exactly that reason.
addopts = -q --strict-markers --strict-config --browser chromium
