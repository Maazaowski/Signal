    - "front-end"
    - "front end"
    - "react"
    - "next.js"
    - "nextjs"
    - "ui"
    - "javascript"
    - "typescript"
    - "web developer"
    - "software engineer"
    - "ui engineer"
    - "full stack"
    - "fullstack"
  title_keywords_negative:
    - "backend only"
    - "back-end only"
    - "ios"
    - "android"
    - "mobile"
    - "devops"
    - "data scientist"
    - "machine learning"
    - "ml engineer"
    - "qa"
    - "rust"
    - "embedded"
    - "intern"
    - "internship"
    - "trainee"
  relevant_tech:
