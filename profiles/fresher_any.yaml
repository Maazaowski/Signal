    - { query: "entry level software developer", country: "IN", date_posted: "week", remote_jobs_only: false }
    - { query: "junior software engineer", country: "IN", date_posted: "week", remote_jobs_only: false }
    - { query: "fresher software developer", country: "IN", date_posted: "3days", remote_jobs_only: false }
    - { query: "software engineer trainee", country: "IN", date_posted: "week", remote_jobs_only: false }
    - { query: "new grad software engineer", country: "IN", date_posted: "week", remote_jobs_only: true }

scoring:
  experience_target: "fresher"
  min_relevance_score: 40
  min_score_to_store: 20
  weights: { title: 35, tech: 30, experience: 20, signal: 15 }
  core_tech:
    - "python"
    - "java"
    - "javascript"
    - "sql"
    - "git"
  backend_signals:
    - "learn"
    - "mentor"
    - "training"
    - "onboarding"
    - "rotation"
    - "fundamental"
    - "fresh graduate"
    - "b.tech"
    - "b.e."
    - "mca"
    - "0-1 year"
    - "0-2 years"
    - "campus"
    - "new grad"
    - "entry level"

location:
  # Signal does not assume where you live. Set these under
  # Settings -> Where you can work, or edit them here before importing.
  #
  # Order matters, and each rule exists because of a real false positive:
  #   1. blocking_terms rule a role out outright
  #   2. home_terms mean it is open to you
  #   3. a concrete foreign city in the location field means it is not
  #   4. global_terms mean genuinely worldwide
  #   5. region_terms are wider regions that include you

  # Phrases that rule a role out FOR YOU. Country restrictions belong here only
  # if they exclude you: "us only" is a blocker if you are not in the US, and
  # not one if you are. Left empty on purpose - it depends entirely on you.
  blocking_terms: []

  # Your country and the cities you can work in, e.g. "portugal", "lisbon".
  home_terms: []

  # Softer hints, checked after the rules above.
  weak_positives: []

  # Country-independent: these mean open to anyone, anywhere. Note that bare
  # "global" and "fully remote" are deliberately absent - both appear in
  # ordinary marketing copy and produced false positives.
  global_terms:
    - "worldwide"
    - "anywhere"
    - "work from anywhere"
    - "location independent"
    - "globally distributed"
    - "remote - global"
    - "remote global"

  # Wider regions that include you, e.g. "apac", "emea", "latam".
  region_terms: []

  # Regions that mean the role is not for you.
  excluded_regions: []

  # Timezone wording that works regardless of where you are.
  timezone_compatible:
    - "flexible"
    - "async"
    - "asynchronous"
    - "overlap"
    - "any timezone"
    - "all timezones"

  # Timezone demands that rule you out. Add the ones that do, e.g. "pst only".
  timezone_incompatible: []

outreach:
  candidate_name: "[Your Name]"
  candidate_core_tech: ["python", "java", "javascript", "sql"]
  candidate_extra_tech: ["git", "html", "css", "linux"]
  linkedin_search_titles:
    - { title: "Engineering Manager", label: "Eng Manager", category: "engineering" }
    - { title: "Tech Lead", label: "Tech Lead", category: "engineering" }
    - { title: "Campus Recruiter", label: "Campus Recruiter", category: "hr" }
    - { title: "Technical Recruiter", label: "Tech Recruiter", category: "hr" }
    - { title: "HR Manager", label: "HR Manager", category: "hr" }
    - { title: "University Recruiting", label: "University Recruiting", category: "hr" }
  bio_short: "a fresh graduate with hands-on projects in {stack}"
  achievements:
    - "CS graduate with strong fundamentals in data structures, algorithms, and OOP."
    - "Built 3+ full-stack projects on GitHub — REST APIs, authentication, database design."
    - "Contributed to 2 open-source projects; comfortable shipping PRs and reading large codebases."
  dm_short_template: "{greeting}, I saw {company} is hiring for {title}. I'm {bio_short}. Would love to connect and learn more about the role."
  dm_long_template: |
    {greeting},

    I noticed {company} is hiring for {title}. The stack caught my eye — I've been building with {stack} through my coursework and side projects.

    {achievements}

    Would love a 15-min chat to hear what you look for in new grads.

    Thanks,
    {candidate_name}
  email_digest_subject_role: "entry-level"
  email_greeting: "Your Daily Job Digest"
